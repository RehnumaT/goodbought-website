[pytest]
testpaths = tests
markers =
    smoke: safe, read only and fast enough to run against production
    advisory: reports a risk but does not block a merge or deploy
    allow_site_errors: the test causes site errors on purpose, so the observability check is off
addopts =
    --strict-markers
    --base-url http://127.0.0.1:8000
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
